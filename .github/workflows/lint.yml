name: Basic Lint

on:
  push:
    branches: [main_v2]
  pull_request:
    branches: [main_v2]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Dependency vulnerability audit
        run: uv run --with pip-audit pip-audit --progress-spinner off

      - name: Pylint check
        run: uv run pylint callbacks components conf utils app.py

      - name: Compile source
        run: uv run python -m compileall callbacks components conf utils app.py

      - name: Run unit tests (pytest)
        run: uv run pytest tests/unit -q

      - name: App import smoke test
        run: uv run python -c "import app; print('app import ok')"
